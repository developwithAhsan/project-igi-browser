name: SEO metadata validation
on:
  push:
    branches: [redesign-oct30]
  pull_request:
    branches: [redesign-oct30]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate page metadata, canonicals, social tags and sitemap
        run: node tools/seo-check.mjs
