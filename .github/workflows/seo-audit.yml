name: SEO metadata validation
on:
  push:
    branches: [core]
  pull_request:
    branches: [core]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/seo-check.mjs
