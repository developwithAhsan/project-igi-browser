name: Generate brand icons and social preview
on:
  push:
    branches: [redesign-oct30]
    paths:
      - "logo.png"
      - "og-project-igi.svg"
      - "tools/generate-brand-assets.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: redesign-oct30
      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg
      - name: Generate icon and social assets from logo.png
        run: python3 tools/generate-brand-assets.py
      - name: Commit generated assets to the existing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon.svg apple-touch-icon.png icon-192.png icon-512.png og-project-igi.png og-project-igi.jpg
          if git diff --cached --quiet; then
            echo "Brand assets are already current."
            exit 0
          fi
          git commit -m "Generate favicon, PWA and social preview assets"
          git push origin HEAD:redesign-oct30
