<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Project I.G.I. Community Comments</title>
<style>
  :root{color-scheme:dark;font:15px/1.5 Inter,system-ui,sans-serif;background:#070b08;color:#eef4ef}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#070b08;color:#eef4ef}
  body{padding:8px}
  #disqus_thread{min-height:180px;width:100%}
</style>
</head>
<body>
<div id="disqus_thread"></div>
<script>
  var disqus_config = function () {
    this.page.url = 'https://project-igi.online/play';
    this.page.identifier = 'https://project-igi.online/play';
    this.page.title = 'Project I.G.I. Online — Community Discussion';
  };
  (function () {
    var d=document,s=d.createElement('script');
    s.src='https://igi-3.disqus.com/embed.js';
    s.async=true;
    s.setAttribute('data-timestamp',String(Date.now()));
    (d.head||d.body).appendChild(s);
  })();
  (function(){
    var send=function(){parent.postMessage({type:'igi-disqus-height',height:Math.ceil(document.documentElement.scrollHeight)},'*')};
    if('ResizeObserver' in window){new ResizeObserver(send).observe(document.body);}
    window.addEventListener('load',send);
    setInterval(send,1500);
  })();
</script>
</body>
</html>
